[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inspection-report"
version = "0.1.0"
description = "Structured inspection reports for heavy equipment from photos, using a small vision-language model on CPU."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akash Kumar" }]
dependencies = ["pydantic>=2.5", "pydantic-settings>=2.1", "httpx>=0.27"]

[project.optional-dependencies]
local = ["transformers>=4.45", "torch>=2.2", "pillow>=10", "num2words"]
pdf = ["fpdf2>=2.7"]
ui = ["gradio>=4"]
dev = ["fpdf2>=2.7", "pytest>=8", "ruff>=0.5"]

[project.scripts]
inspection-report = "inspection_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
